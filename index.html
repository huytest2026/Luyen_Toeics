<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài Thi Trắc Nghiệm TOEIC</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 15px; color: #333; }
    .nav-container { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav-btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { background: #007bff; color: white; border-color: #007bff; }
    
    .question-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    .img-box { text-align: center; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; }
    .img-box img { max-width: 100%; max-height: 350px; border-radius: 4px; }
    
    audio { width: 100%; margin-bottom: 15px; }
    
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .option-btn { text-align: left; padding: 12px 15px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 15px; }
    .option-btn.correct { background: #28a745; color: white; border-color: #28a745; font-weight: bold; }
    .option-btn.wrong { background: #dc3545; color: white; border-color: #dc3545; font-weight: bold; }
    
    .controls { display: flex; justify-content: space-between; }
    .ctrl-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #007bff; color: white; }
    .ctrl-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Thanh danh sách câu hỏi -->
  <div class="nav-container" id="navBar"></div>

  <!-- Nội dung câu hỏi -->
  <div class="question-title" id="qTitle">Câu 1</div>
  <div class="img-box">
    <img id="qImage" src="" alt="Hình ảnh câu hỏi">
  </div>
  
  <audio id="qAudio" controls src=""></audio>

  <!-- Danh sách đáp án -->
  <div class="options" id="optionsBox"></div>

  <!-- Nút điều hướng -->
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" onclick="changeQuestion(-1)">Câu Trước</button>
    <button class="ctrl-btn" id="nextBtn" onclick="changeQuestion(1)">Câu Tiếp</button>
  </div>

  <script>
    // Khai báo dữ liệu bài thi
    const examData = [
      {
        id: 1,
        image: "images/img_1.png",
        audio: "audios/audio_1.mp3",
        options: [
          "(A) Items are being placed on shelves.",
          "(B) Boxes are stacked in the warehouse.",
          "(C) The floor is being swept.",
          "(D) Trucks are loading goods."
        ],
        correct: 1 // Đáp án B (chỉ số 1: 0=A, 1=B, 2=C, 3=D)
      },
      {
        id: 2,
        image: "images/img_2.png",
        audio: "audios/audio_2.mp3",
        options: [
          "(A) She is working on a computer.",
          "(B) She is talking on the phone.",
          "(C) She is writing in a notebook.",
          "(D) She is holding a cup."
        ],
        correct: 0 // Đáp án A
      }
    ];

    let currentIndex = 0;
    let selectedAnswers = {};

    function renderNav() {
      const navBar = document.getElementById('navBar');
      navBar.innerHTML = '';
      examData.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${idx === currentIndex ? 'active' : ''}`;
        btn.innerText = q.id;
        btn.onclick = () => loadQuestion(idx);
        navBar.appendChild(btn);
      });
    }

    function loadQuestion(index) {
      currentIndex = index;
      renderNav();

      const q = examData[currentIndex];
      document.getElementById('qTitle').innerText = `Câu ${q.id}`;
      document.getElementById('qImage').src = q.image;
      
      const audioPlayer = document.getElementById('qAudio');
      audioPlayer.src = q.audio;
      audioPlayer.load();

      const optionsBox = document.getElementById('optionsBox');
      optionsBox.innerHTML = '';

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;

        // Nếu câu hỏi này đã được chọn đáp án trước đó
        if (selectedAnswers[currentIndex] !== undefined) {
          if (optIdx === q.correct) btn.classList.add('correct');
          if (optIdx === selectedAnswers[currentIndex] && optIdx !== q.correct) btn.classList.add('wrong');
        }

        btn.onclick = () => {
          selectedAnswers[currentIndex] = optIdx;
          loadQuestion(currentIndex); // Render lại để hiện màu đúng/sai
        };

        optionsBox.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === examData.length - 1;
    }

    function changeQuestion(step) {
      const newIndex = currentIndex + step;
      if (newIndex >= 0 && newIndex < examData.length) {
        loadQuestion(newIndex);
      }
    }

    // Khởi chạy câu đầu tiên
    loadQuestion(0);
  </script>
</body>
</html>
