<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trích xuất ảnh TOEIC chuẩn</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; color: #333; }
    .upload-box { background: #f0f4f8; border: 2px dashed #007bff; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .loading { display: none; font-weight: bold; color: #007bff; margin-top: 10px; }
    
    .nav-container { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; max-height: 150px; overflow-y: auto; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .nav-btn { width: 36px; height: 36px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { background: #007bff; color: white; border-color: #007bff; }
    
    .img-box { text-align: center; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 8px; min-height: 250px; }
    .img-box img { max-width: 100%; max-height: 400px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    audio { width: 100%; margin-bottom: 15px; }
    .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .option-btn { text-align: left; padding: 10px 15px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; }
    .option-btn.correct { background: #28a745; color: white; }
    .option-btn.wrong { background: #dc3545; color: white; }
    .controls { display: flex; justify-content: space-between; }
    .ctrl-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #007bff; color: white; }
    .ctrl-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="upload-box">
    <label for="pdfInput"><strong>Chọn file PDF câu hỏi TOEIC Part 1:</strong></label><br>
    <input type="file" id="pdfInput" accept="application/pdf">
    <div id="loadingText" class="loading">Đang trích xuất ảnh từ PDF...</div>
  </div>

  <div class="nav-container" id="navBar"></div>
  <h3 id="qTitle">Câu 1</h3>
  
  <div class="img-box">
    <img id="qImage" src="" alt="Chưa chọn bài thi">
  </div>
  
  <audio id="qAudio" controls src=""></audio>
  <div class="options" id="optionsBox"></div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" onclick="changeQuestion(-1)" disabled>Câu Trước</button>
    <button class="ctrl-btn" id="nextBtn" onclick="changeQuestion(1)" disabled>Câu Tiếp</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let examData = [];
    let currentIndex = 0;
    let selectedAnswers = {};

    document.getElementById('pdfInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('loadingText').style.display = 'block';
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      examData = [];
      selectedAnswers = {};
      let qNum = 1;

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const ops = await page.getOperatorList();
        
        // Duyệt tìm các đối tượng hình ảnh thực sự trong file PDF
        for (let i = 0; i < ops.fnArray.length; i++) {
          if (ops.fnArray[i] === pdfjsLib.OPS.paintImageXObject || 
              ops.fnArray[i] === pdfjsLib.OPS.paintJpegXObject) {
            
            const imgName = ops.argsArray[i][0];
            
            try {
              // Lấy object ảnh từ bộ nhớ PDF.js
              const imgObj = await new Promise(resolve => page.objs.get(imgName, resolve));
              
              if (imgObj && imgObj.width > 150 && imgObj.height > 150) { // Bỏ qua logo nhỏ/icon
                const canvas = document.createElement('canvas');
                canvas.width = imgObj.width;
                canvas.height = imgObj.height;
                const ctx = canvas.getContext('2d');

                // Dựng lại ảnh gốc từ mảng điểm ảnh (Pixel Data)
                const imgData = ctx.createImageData(imgObj.width, imgObj.height);
                if (imgObj.data.length === imgObj.width * imgObj.height * 4) {
                  imgData.data.set(imgObj.data);
                } else {
                  let j = 0;
                  for (let k = 0; k < imgObj.data.length; k += 3) {
                    imgData.data[j] = imgObj.data[k];
                    imgData.data[j+1] = imgObj.data[k+1];
                    imgData.data[j+2] = imgObj.data[k+2];
                    imgData.data[j+3] = 255;
                    j += 4;
                  }
                }
                ctx.putImageData(imgData, 0, 0);

                examData.push({
                  id: qNum,
                  image: canvas.toDataURL('image/png'),
                  audio: `audios/audio_${qNum}.mp3`,
                  options: ["(A) Đáp án A", "(B) Đáp án B", "(C) Đáp án C", "(D) Đáp án D"],
                  correct: 0
                });
                qNum++;
              }
            } catch (err) {
              console.error("Lỗi đọc ảnh:", err);
            }
          }
        }
      }

      document.getElementById('loadingText').style.display = 'none';
      if (examData.length > 0) loadQuestion(0);
    });

    function renderNav() {
      const navBar = document.getElementById('navBar');
      navBar.innerHTML = '';
      examData.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${idx === currentIndex ? 'active' : ''}`;
        btn.innerText = q.id;
        btn.onclick = () => loadQuestion(idx);
        navBar.appendChild(btn);
      });
    }

    function loadQuestion(index) {
      if (examData.length === 0) return;
      currentIndex = index;
      renderNav();

      const q = examData[currentIndex];
      document.getElementById('qTitle').innerText = `Câu ${q.id}`;
      document.getElementById('qImage').src = q.image;
      
      const audioPlayer = document.getElementById('qAudio');
      audioPlayer.src = q.audio;
      audioPlayer.load();

      const optionsBox = document.getElementById('optionsBox');
      optionsBox.innerHTML = '';

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;

        if (selectedAnswers[currentIndex] !== undefined) {
          if (optIdx === q.correct) btn.classList.add('correct');
          if (optIdx === selectedAnswers[currentIndex] && optIdx !== q.correct) btn.classList.add('wrong');
        }

        btn.onclick = () => {
          selectedAnswers[currentIndex] = optIdx;
          loadQuestion(currentIndex);
        };
        optionsBox.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === examData.length - 1;
    }

    function changeQuestion(step) {
      const newIndex = currentIndex + step;
      if (newIndex >= 0 && newIndex < examData.length) {
        loadQuestion(newIndex);
      }
    }
  </script>
</body>
</html>
